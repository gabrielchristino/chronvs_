[platformio]
default_envs = waveshare_esp32_s3_touch_lcd_146
extra_configs = 

[env:waveshare_esp32_s3_touch_lcd_146]
platform = espressif32 @ 6.9.0
board = waveshare-esp32-s3-touch-lcd-146
framework = espidf
build_type = release
board_build.sdkconfig = sdkconfig.defaults
board_build.partitions = partitions.csv
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
upload_port = COM3
upload_protocol = custom
build_unflags = -Os -Og -O0
build_flags = -O2 -g0
custom_lvgl_optimization = -O2
custom_serial_diagnostics = no
extra_scripts = pre:scripts/add_waveshare_drivers.py, pre:scripts/configure_logging.py, pre:scripts/upload_waveshare.py, post:scripts/configure_lvgl_optimization.py

; A/B diagnostics: only LVGL optimization differs.
[env:display_profile]
extends = env:waveshare_esp32_s3_touch_lcd_146
build_type = debug
build_flags = -O0 -DCHRONVS_DISPLAY_PROFILE
custom_lvgl_optimization = -O0
custom_sdkconfig_reference = sdkconfig.waveshare_esp32_s3_touch_lcd_146
custom_serial_diagnostics = yes

[env:display_profile_o2]
extends = env:display_profile
custom_lvgl_optimization = -O2

; Isolate orbital rendering cost while retaining the same circular panels.
[env:display_profile_flat]
extends = env:display_profile_o2
build_flags = ${env:display_profile.build_flags} -DCHRONVS_WATCH_FLAT_BACKGROUND

; P1: nested primitive timing; compare overhead with display_profile_o2.
[env:display_profile_primitives]
extends = env:display_profile_o2
build_flags = ${env:display_profile.build_flags} -DCHRONVS_WATCH_DETAIL_PROFILE

; P2 experiment: compare MOTHER_FACE against display_profile_primitives.
[env:display_profile_mother]
extends = env:display_profile_primitives
build_flags = ${env:display_profile_primitives.build_flags} -DCHRONVS_WATCH_MOTHER_CACHE

; P6: panel timing, keeping the mother face vector-based in both variants.
[env:display_profile_panels_reference]
extends = env:display_profile_o2
build_flags = ${env:display_profile.build_flags} -DCHRONVS_PANEL_PROFILE

[env:display_profile_panels]
extends = env:display_profile_panels_reference
build_flags = ${env:display_profile_panels_reference.build_flags} -DCHRONVS_PANEL_NO_CLOSE_REDRAW

; P6 perceptual check: same candidate, without profiling or serial diagnostics.
; Compare against display_profile_panels for instrumentation overhead, and
; against the default environment for the close-redraw change in quiet builds.
[env:panels_quiet]
extends = env:waveshare_esp32_s3_touch_lcd_146
build_flags = ${env:waveshare_esp32_s3_touch_lcd_146.build_flags} -DCHRONVS_PANEL_NO_CLOSE_REDRAW
custom_sdkconfig_reference = sdkconfig.waveshare_esp32_s3_touch_lcd_146
custom_serial_diagnostics = no

; P6 isolated code optimization; reference is panels_quiet.
[env:panels_code_o2]
extends = env:panels_quiet
build_flags = ${env:panels_quiet.build_flags} -DCHRONVS_PANEL_CODE_O2

; Content-cost isolation, preserving panel surfaces and controls.
[env:panels_no_content]
extends = env:panels_quiet
build_flags = ${env:panels_quiet.build_flags} -DCHRONVS_PANEL_NO_CONTENT

; Restore labels while omitting launcher, weather and volume icons.
[env:panels_no_icons]
extends = env:panels_quiet
build_flags = ${env:panels_quiet.build_flags} -DCHRONVS_PANEL_NO_ICONS

; Restore full menus; cache launcher icons only on fully opaque rows.
[env:launcher_icon_cache]
extends = env:panels_quiet
build_flags = ${env:panels_quiet.build_flags} -DCHRONVS_LAUNCHER_ICON_CACHE
