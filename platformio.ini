[platformio]
default_envs = waveshare_esp32_s3_touch_lcd_146
extra_configs = 

[env:waveshare_esp32_s3_touch_lcd_146]
platform = espressif32 @ 6.9.0
board = waveshare-esp32-s3-touch-lcd-146
framework = espidf
build_type = release
board_build.sdkconfig = sdkconfig.defaults
board_build.partitions = partitions.csv
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
upload_port = COM3
upload_protocol = custom
build_unflags = -Os -Og -O0
build_flags = -O2 -g0 -DLV_CIRCLE_CACHE_SIZE=16 -DCHRONVS_WATCH_SCENE_CACHE
custom_lvgl_optimization = -O2
custom_serial_diagnostics = no
; Measured on the real drawers and Clima/TLS; preserve the data-cache policy.
custom_instruction_cache = 32
custom_data_cache_line = 32
extra_scripts = pre:scripts/add_waveshare_drivers.py, pre:scripts/configure_logging.py, pre:scripts/upload_waveshare.py, post:scripts/configure_lvgl_optimization.py

; Isolated USB hardware bench, without LCD or LVGL initialization.
[env:hardware_diagnostic]
extends = env:waveshare_esp32_s3_touch_lcd_146
build_flags = ${env:waveshare_esp32_s3_touch_lcd_146.build_flags} -DCHRONVS_HARDWARE_DIAGNOSTIC
custom_sdkconfig_reference = sdkconfig.waveshare_esp32_s3_touch_lcd_146
custom_serial_diagnostics = usb

; Dedicated VPN runtime for the current assembly without LCD/touch.
[env:tailtiny]
extends = env:waveshare_esp32_s3_touch_lcd_146
build_flags = ${env:waveshare_esp32_s3_touch_lcd_146.build_flags} -DCHRONVS_TAILTINY
board_build.cmake_extra_args = -DCHRONVS_TAILTINY=ON
custom_serial_diagnostics = usb
extra_scripts =
    pre:scripts/add_waveshare_drivers.py
    pre:scripts/configure_tailtiny.py
    pre:scripts/configure_logging.py
    pre:scripts/upload_waveshare.py
    post:scripts/configure_lvgl_optimization.py

; BLE radio bench; the normal firmware keeps Bluetooth disabled.
[env:bluetooth_diagnostic]
extends = env:waveshare_esp32_s3_touch_lcd_146
build_flags = ${env:waveshare_esp32_s3_touch_lcd_146.build_flags} -DCHRONVS_BLUETOOTH_DIAGNOSTIC
custom_sdkconfig_reference = sdkconfig.waveshare_esp32_s3_touch_lcd_146
custom_serial_diagnostics = usb
custom_bluetooth_diagnostic = yes

; Explicit temporary GPS standby test; UART console stays disabled.
[env:gps_standby_test]
extends = env:waveshare_esp32_s3_touch_lcd_146
build_flags = ${env:waveshare_esp32_s3_touch_lcd_146.build_flags} -DCHRONVS_GPS_STANDBY_TEST
custom_sdkconfig_reference = sdkconfig.waveshare_esp32_s3_touch_lcd_146

; Temporary indoor probe. USB-only logs keep GPIO43 free for GNSS assistance.
[env:gps_assist_diagnostic]
extends = env:waveshare_esp32_s3_touch_lcd_146
build_flags = ${env:waveshare_esp32_s3_touch_lcd_146.build_flags} -DCHRONVS_GPS_ASSIST_DIAGNOSTIC
custom_sdkconfig_reference = sdkconfig.waveshare_esp32_s3_touch_lcd_146
custom_serial_diagnostics = usb

; Scan/TE experiments retain release/O2 and use USB without occupying GNSS TX.
[env:display_scan]
extends = env:waveshare_esp32_s3_touch_lcd_146
custom_instruction_cache = 16
custom_lvgl_optimization = -O2
; Preserve the measured pre-cache control after adopting the cache in default.
build_flags = -O2 -g0 -DCHRONVS_DISPLAY_SCAN -DCHRONVS_DISPLAY_BENCH -DCHRONVS_BRIGHTNESS_ARC_REFERENCE
custom_sdkconfig_reference = sdkconfig.waveshare_esp32_s3_touch_lcd_146
custom_serial_diagnostics = usb

; Only difference from display_scan: wait for a fresh TE before the first strip.
[env:display_scan_te]
extends = env:display_scan
build_flags = ${env:display_scan.build_flags} -DCHRONVS_DISPLAY_TE_SYNC

; Bound the automated scene test and measure watch primitives at release/O2.
; TE wait is OFF: it did not improve the menus in the physical comparison.
[env:display_scan_detail]
extends = env:display_scan
build_flags = ${env:display_scan.build_flags} -DCHRONVS_DISPLAY_PROFILE -DCHRONVS_WATCH_DETAIL_PROFILE -DCHRONVS_PANEL_PROFILE -DCHRONVS_DISPLAY_BENCH_AUTORUN

; Isolate circle-mask cache capacity; keep all renderer and transport settings.
[env:display_scan_circles]
extends = env:display_scan_detail
build_flags = ${env:display_scan_detail.build_flags} -DLV_CIRCLE_CACHE_SIZE=16

; Reuse the frozen watch through bounded RLE rows; no new pixel framebuffer.
[env:display_scan_scene]
extends = env:display_scan_circles
build_flags = ${env:display_scan_circles.build_flags} -DCHRONVS_WATCH_SCENE_CACHE

; Final perceptual check: cache candidate, normal UI, no TE wait or diagnostics.
[env:display_scene_quiet]
extends = env:waveshare_esp32_s3_touch_lcd_146
build_flags = ${env:waveshare_esp32_s3_touch_lcd_146.build_flags}
custom_sdkconfig_reference = sdkconfig.waveshare_esp32_s3_touch_lcd_146
custom_serial_diagnostics = no

; A/B diagnostics: only LVGL optimization differs.
[env:panel_autotest]
extends = env:waveshare_esp32_s3_touch_lcd_146
; Freeze the original control after promoting the instruction-cache candidate.
custom_instruction_cache = 16
custom_data_cache_line = 32
custom_lvgl_optimization = -O2
build_flags = ${env:waveshare_esp32_s3_touch_lcd_146.build_flags} -DCHRONVS_PANEL_AUTOTEST -DCHRONVS_DISPLAY_PROFILE -DCHRONVS_PANEL_PROFILE -DCHRONVS_BRIGHTNESS_ARC_REFERENCE -DCHRONVS_PANEL_SNAP_REFERENCE
custom_sdkconfig_reference = sdkconfig.waveshare_esp32_s3_touch_lcd_146
custom_serial_diagnostics = usb

; Real-drawer comparison: avoid redundant circular masks on interior controls.
[env:panel_autotest_clip]
extends = env:panel_autotest
build_flags = ${env:panel_autotest.build_flags} -DCHRONVS_PANEL_SELECTIVE_CLIP

; One hardware variable: 64-byte data-cache lines, retaining the 32 KiB cache.
[env:panel_autotest_cache64]
extends = env:panel_autotest
custom_data_cache_line = 64

; Independent A/B: instruction cache 16 -> 32 KiB; data cache remains original.
[env:panel_autotest_icache32]
extends = env:panel_autotest
custom_instruction_cache = 32
custom_data_cache_line = 32

; Test instruction footprint without consuming more RAM: LVGL only at -Os.
[env:panel_autotest_lvgl_os]
extends = env:panel_autotest
custom_lvgl_optimization = -Os
custom_instruction_cache = 16
custom_data_cache_line = 32

; Same instruction-cache candidate, followed by the normal Clima HTTPS flow.
[env:panel_autotest_icache32_weather]
extends = env:panel_autotest_icache32
build_flags = ${env:panel_autotest.build_flags} -DCHRONVS_PANEL_AUTOTEST_WEATHER

; Locate paint cost in actual controls/labels/icons at the current cache policy.
[env:panel_autotest_parts]
extends = env:panel_autotest_icache32
build_flags = ${env:panel_autotest.build_flags} -DCHRONVS_PANEL_PART_PROFILE

[env:panel_autotest_arc_clip]
extends = env:panel_autotest_parts
build_flags = ${env:panel_autotest_parts.build_flags} -DCHRONVS_ARC_INNER_CLIP

; Isolate IDF/libc memory operations; TLSF pool, pixels and DMA stay unchanged.
[env:panel_autotest_memops]
extends = env:panel_autotest_parts
build_flags = ${env:panel_autotest_parts.build_flags} -DLV_MEMCPY_MEMSET_STD=1

; New normal control, same gestures and instrumentation as the arc reference.
[env:panel_autotest_slider]
extends = env:panel_autotest_icache32
build_flags = ${env:waveshare_esp32_s3_touch_lcd_146.build_flags} -DCHRONVS_PANEL_AUTOTEST -DCHRONVS_DISPLAY_PROFILE -DCHRONVS_PANEL_PROFILE -DCHRONVS_PANEL_PART_PROFILE -DCHRONVS_PANEL_SNAP_REFERENCE -DCHRONVS_BRIGHTNESS_SLIDER_REFERENCE

; Preserve the current design; precompose only opaque launcher icon drawings.
[env:panel_autotest_icons]
extends = env:panel_autotest_slider
build_flags = ${env:panel_autotest_slider.build_flags} -DCHRONVS_LAUNCHER_ICON_CACHE

[env:panel_autotest_icons_opaque]
extends = env:panel_autotest_icons
build_flags = ${env:panel_autotest_icons.build_flags} -DCHRONVS_LAUNCHER_ICON_OPAQUE

; Final selected behavior: shared release motion, original vectors, Clima check.
[env:panel_autotest_motion]
extends = env:panel_autotest_icache32
build_flags = ${env:waveshare_esp32_s3_touch_lcd_146.build_flags} -DCHRONVS_PANEL_AUTOTEST -DCHRONVS_DISPLAY_PROFILE -DCHRONVS_PANEL_PROFILE -DCHRONVS_PANEL_PART_PROFILE -DCHRONVS_PANEL_AUTOTEST_WEATHER -DCHRONVS_BRIGHTNESS_SLIDER_REFERENCE

[env:panel_autotest_lighting]
extends = env:panel_autotest_icache32
build_flags = ${env:waveshare_esp32_s3_touch_lcd_146.build_flags} -DCHRONVS_PANEL_AUTOTEST -DCHRONVS_DISPLAY_PROFILE -DCHRONVS_PANEL_PROFILE -DCHRONVS_PANEL_PART_PROFILE -DCHRONVS_PANEL_AUTOTEST_WEATHER

; Current launcher, real display/QSPI, scripted scroll only; restore default after testing.
[env:launcher_scroll_autotest]
extends = env:waveshare_esp32_s3_touch_lcd_146
build_flags = ${env:waveshare_esp32_s3_touch_lcd_146.build_flags} -DCHRONVS_PANEL_AUTOTEST -DCHRONVS_LAUNCHER_SCROLL_AUTOTEST
custom_sdkconfig_reference = sdkconfig.waveshare_esp32_s3_touch_lcd_146
custom_serial_diagnostics = usb

; A/B diagnostics: only LVGL optimization differs.
[env:display_profile]
extends = env:waveshare_esp32_s3_touch_lcd_146
custom_instruction_cache = 16
build_type = debug
build_flags = -O0 -DCHRONVS_DISPLAY_PROFILE -DCHRONVS_BRIGHTNESS_ARC_REFERENCE
custom_lvgl_optimization = -O0
custom_sdkconfig_reference = sdkconfig.waveshare_esp32_s3_touch_lcd_146
custom_serial_diagnostics = yes

[env:display_profile_o2]
extends = env:display_profile
custom_lvgl_optimization = -O2

; Explicit enrollment only: record 2 s in PSRAM, then send PCM over console.
; Does not load MultiNet or change the normal firmware's voice backend.
[env:vox_capture]
extends = env:display_profile_o2
build_flags = -O0 -DCHRONVS_VOX_CAPTURE
custom_serial_diagnostics = capture

; Isolate orbital rendering cost while retaining the same circular panels.
[env:display_profile_flat]
extends = env:display_profile_o2
build_flags = ${env:display_profile.build_flags} -DCHRONVS_WATCH_FLAT_BACKGROUND

; P1: nested primitive timing; compare overhead with display_profile_o2.
[env:display_profile_primitives]
extends = env:display_profile_o2
build_flags = ${env:display_profile.build_flags} -DCHRONVS_WATCH_DETAIL_PROFILE

; P2 experiment: compare MOTHER_FACE against display_profile_primitives.
[env:display_profile_mother]
extends = env:display_profile_primitives
build_flags = ${env:display_profile_primitives.build_flags} -DCHRONVS_WATCH_MOTHER_CACHE

; P6: panel timing, keeping the mother face vector-based in both variants.
[env:display_profile_panels_reference]
extends = env:display_profile_o2
build_flags = ${env:display_profile.build_flags} -DCHRONVS_PANEL_PROFILE

[env:display_profile_panels]
extends = env:display_profile_panels_reference
build_flags = ${env:display_profile_panels_reference.build_flags} -DCHRONVS_PANEL_NO_CLOSE_REDRAW

; P6 perceptual check: same candidate, without profiling or serial diagnostics.
; Compare against display_profile_panels for instrumentation overhead, and
; against the default environment for the close-redraw change in quiet builds.
[env:panels_quiet]
extends = env:waveshare_esp32_s3_touch_lcd_146
custom_instruction_cache = 16
build_flags = ${env:waveshare_esp32_s3_touch_lcd_146.build_flags} -DCHRONVS_PANEL_NO_CLOSE_REDRAW -DCHRONVS_BRIGHTNESS_ARC_REFERENCE
custom_sdkconfig_reference = sdkconfig.waveshare_esp32_s3_touch_lcd_146
custom_serial_diagnostics = no

; P6 isolated code optimization; reference is panels_quiet.
[env:panels_code_o2]
extends = env:panels_quiet
build_flags = ${env:panels_quiet.build_flags} -DCHRONVS_PANEL_CODE_O2

; Content-cost isolation, preserving panel surfaces and controls.
[env:panels_no_content]
extends = env:panels_quiet
build_flags = ${env:panels_quiet.build_flags} -DCHRONVS_PANEL_NO_CONTENT

; Restore labels while omitting launcher, weather and volume icons.
[env:panels_no_icons]
extends = env:panels_quiet
build_flags = ${env:panels_quiet.build_flags} -DCHRONVS_PANEL_NO_ICONS

; Restore full menus; cache launcher icons only on fully opaque rows.
[env:launcher_icon_cache]
extends = env:panels_quiet
build_flags = ${env:panels_quiet.build_flags} -DCHRONVS_LAUNCHER_ICON_CACHE
